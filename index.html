
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Клубничные хвостики</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff0f5;color:#754b61;font-family:Arial,sans-serif;text-align:center}
header{padding:22px;background:#ffd6e7;font-size:25px;font-weight:bold}
main{max-width:450px;margin:auto;padding:18px}
.card{background:#fff;border-radius:22px;padding:18px;margin:15px 0;box-shadow:0 4px 12px #e9bfd0}
.rat{font-size:100px;margin:12px}
button{border:0;border-radius:15px;background:#ffb7d0;color:#713e59;padding:13px 17px;margin:5px;font-size:16px;font-weight:bold}
button:active{transform:scale(.96)}
.stats{font-size:17px;line-height:2}
#message{min-height:45px}
</style>
</head><link rel="manifest" href="manifest.json">
<body>
<header>🍓 Клубничные хвостики 🐭</header>
<main>
<div class="card">
<h2 id="name">Мышка Пуговка</h2>
<div class="rat" id="rat">🐭</div>
<div id="message">Привет! Давай дружить!</div>
</div>
<div class="card stats">
🍓 Клубнички: <b id="berries">5</b><br>
🍎 Сытость: <b id="food">70</b><br>
💗 Настроение: <b id="mood">80</b>
</div>
<div class="card">
<h3>Забота о питомце</h3>
<button onclick="feed()">🍎 Покормить</button>
<button onclick="play()">🧸 Поиграть</button>
<button onclick="sleep()">🌙 Уложить спать</button>
</div>
<div class="card">
<h3>🌲 Клубничный лес</h3>
<p>Отправляйся на поиски ягод!</p>
<button onclick="forest()">Отправиться в лес</button>
</div>
<div class="card">
<h3>🎁 Загадочный подарок</h3>
<p>Вдруг внутри новый крысёныш?</p>
<button onclick="gift()">Открыть подарок (3 🍓)</button>
</div>
</main>
<script>
let berries=5,food=70,mood=80;
let names=["Пуговка","Крошка","Пиксель","Зефирка","Бусинка"];
let rats=["🐭","🐀","🐁"];
function update(){
document.getElementById("berries").textContent=berries;
document.getElementById("food").textContent=food;
document.getElementById("mood").textContent=mood;
}
function say(t){document.getElementById("message").textContent=t}
function feed(){
food=Math.min(100,food+20);
say("Ням-ням! Как вкусно! 🍎");
update();
}
function play(){
mood=Math.min(100,mood+20);
food=Math.max(0,food-8);
say("Как весело играть! 💗");
update();
}
function sleep(){
food=Math.max(0,food-3);
mood=Math.min(100,mood+12);
say("Сладких снов, маленький хвостик! 🌙");
update();
}
function forest(){
let found=Math.floor(Math.random()*4)+1;
berries+=found;
say("В лесу найдено клубничек: "+found+"! 🍓");
update();
}
function gift(){
if(berries<3){say("Нужно ещё 3 клубнички! 🍓");return}
berries-=3;
let n=names[Math.floor(Math.random()*names.length)];
let r=rats[Math.floor(Math.random()*rats.length)];
document.getElementById("name").textContent=n;
document.getElementById("rat").textContent=r;
say("Ура! К тебе приехал новый малыш — "+n+"! 🎀");
update();
}
update();
</script>
</body>
</html>
